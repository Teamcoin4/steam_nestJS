global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'steam-nestjs'
    environment: 'development'

# Alertmanager 연동
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# 알림 규칙 파일
rule_files:
  # - "rules/*.yml"

# 메트릭 수집 대상
scrape_configs:
  # Prometheus 자체 모니터링
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # NestJS 애플리케이션
  - job_name: 'nestjs-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3001']
        labels:
          service: 'steam-api'
          env: 'dev'

  # Node Exporter (선택사항 - 시스템 메트릭)
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
